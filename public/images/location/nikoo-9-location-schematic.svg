<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" role="img" aria-labelledby="title desc">
  <title id="title">Nikoo Homes 9 location schematic</title>
  <desc id="desc">A not-to-scale location schematic showing Nikoo Homes 9 on KIADB Hardware Park Main Road with verified distance markers for New Airport Road, Budigere Main Road and Bagalur.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f5ef"/>
      <stop offset="1" stop-color="#e6ece6"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#0e2f43" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#092536" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="900" height="1125" fill="url(#paper)"/>
  <rect width="900" height="1125" fill="url(#grid)"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-80 260C155 305 282 378 422 515s275 207 558 246" stroke="#ffffff" stroke-width="60"/>
    <path d="M-80 260C155 305 282 378 422 515s275 207 558 246" stroke="#698275" stroke-width="34"/>
    <path d="M-80 260C155 305 282 378 422 515s275 207 558 246" stroke="#f8f5ef" stroke-width="3" stroke-dasharray="18 16"/>

    <path d="M-40 838C178 799 368 776 565 782s320 35 396 71" stroke="#ffffff" stroke-width="58"/>
    <path d="M-40 838C178 799 368 776 565 782s320 35 396 71" stroke="#0e2f43" stroke-width="32"/>
    <path d="M-40 838C178 799 368 776 565 782s320 35 396 71" stroke="#ffffff" stroke-opacity=".75" stroke-width="3" stroke-dasharray="18 16"/>

    <path d="M575 1135C555 992 564 886 593 782s58-222 37-368" stroke="#ffffff" stroke-width="46"/>
    <path d="M575 1135C555 992 564 886 593 782s58-222 37-368" stroke="#9cac9f" stroke-width="24"/>

    <path d="M124 1070C175 975 242 918 342 864" stroke="#ffffff" stroke-width="34"/>
    <path d="M124 1070C175 975 242 918 342 864" stroke="#c8d0c8" stroke-width="18"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#0e2f43">
    <g transform="translate(82 156)">
      <rect width="300" height="78" rx="39" fill="#fffdfa" stroke="#0e2f43" stroke-opacity=".12"/>
      <circle cx="42" cy="39" r="22" fill="#698275"/>
      <path d="M31 39h22M42 28v22" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <text x="78" y="34" font-size="18" font-weight="700">NEW AIRPORT ROAD</text>
      <text x="78" y="57" font-size="15" fill="#637077">200 m from project</text>
    </g>

    <g transform="translate(64 865)">
      <rect width="286" height="76" rx="18" fill="#fffdfa" stroke="#0e2f43" stroke-opacity=".12"/>
      <text x="24" y="32" font-size="17" font-weight="700">BUDIGERE MAIN ROAD</text>
      <text x="24" y="55" font-size="15" fill="#637077">3.9 km from project</text>
    </g>

    <g transform="translate(626 888)">
      <rect width="204" height="76" rx="18" fill="#fffdfa" stroke="#0e2f43" stroke-opacity=".12"/>
      <text x="24" y="32" font-size="17" font-weight="700">BAGALUR</text>
      <text x="24" y="55" font-size="15" fill="#637077">4.2 km from project</text>
    </g>

    <text x="420" y="740" font-size="18" font-weight="700" letter-spacing="2" fill="#fff" transform="rotate(2 420 740)">KIADB HARDWARE PARK MAIN ROAD</text>
  </g>

  <g transform="translate(532 658)" filter="url(#shadow)">
    <path d="M0-78c-48 0-87 39-87 87 0 65 87 151 87 151S87 74 87 9C87-39 48-78 0-78Z" fill="#d7273f"/>
    <circle cy="7" r="35" fill="#fffdfa"/>
    <path d="M-19 22V-8L0-22 19-8v30M-26 22h52M-8 22V5H8v17" fill="none" stroke="#0e2f43" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(400 882)" font-family="Arial, Helvetica, sans-serif">
    <rect width="420" height="154" rx="24" fill="#092536"/>
    <text x="28" y="37" fill="#d9a948" font-size="14" font-weight="700" letter-spacing="3">NIKOO HOMES 9</text>
    <text x="28" y="72" fill="#fff" font-size="22" font-weight="700">Huvinayakanahalli</text>
    <text x="28" y="101" fill="#cbd4d4" font-size="16">Aerospace Park, Bengaluru</text>
    <text x="28" y="129" fill="#91a0a3" font-size="13">Schematic only · not to scale</text>
  </g>
</svg>
